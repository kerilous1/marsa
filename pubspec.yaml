name: marsa
description: "MARSA — Capture. Route. Keep. A local-first content interception and routing engine."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # -- State Management --
  flutter_bloc: ^9.1.0        # Cubit-based state management
  equatable: ^2.0.7            # Value equality for states and entities

  # -- Local Database --
  drift: ^2.23.1               # SQLite database with FTS5 full-text search support
  sqlite3_flutter_libs: ^0.5.0 # Native SQLite3 bindings for Flutter

  # -- File System & Paths --
  path_provider: ^2.1.5        # Access app-private directories
  path: ^1.9.1                 # Cross-platform path manipulation

  # -- Design & Typography --
  google_fonts: ^6.2.1         # Cairo font for Arabic UI
  cupertino_icons: ^1.0.8      # iOS-style icons

  # -- Sharing & Clipboard --
  share_plus: ^10.1.4          # Re-share content to external apps
  receive_sharing_intent: ^1.8.1 # Intercept OS Share Sheet payloads

  # -- Utilities --
  uuid: ^4.5.1                 # Generate unique IDs for vault entries
  intl: ^0.20.2                # Date formatting for timestamps

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # -- Drift Code Generation --
  drift_dev: ^2.23.1           # Drift schema code generator
  build_runner: ^2.4.15        # Code generation runner

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/

